<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Критерії оцінювання</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="inner-page">

    <div id="header-placeholder"></div>

    <main>
        <section class="section">
            <div class="container">
                <h1 class="page-title">Критерії оцінювання</h1>

                <style>
                    .criteria-card {
                        background: #fff;
                        border-radius: 20px;
                        padding: 40px;
                        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
                        text-align: center;
                        max-width: 700px;
                        margin: 20px auto 60px auto;
                        border-top: 6px solid #2196f3;
                        transition: transform 0.3s ease, box-shadow 0.3s ease;
                    }

                    .criteria-card:hover {
                        transform: translateY(-5px);
                        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
                    }

                    .criteria-icon-wrap {
                        width: 90px;
                        height: 90px;
                        background: #e3f2fd;
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        margin: 0 auto 25px auto;
                        box-shadow: 0 8px 20px rgba(33, 150, 243, 0.15);
                    }

                    .criteria-icon {
                        font-size: 2.8rem;
                        color: #2196f3;
                    }

                    .criteria-title {
                        font-family: 'Montserrat', sans-serif;
                        font-size: 1.6rem;
                        color: #333;
                        margin-bottom: 15px;
                        font-weight: 700;
                    }

                    .criteria-text {
                        color: #555;
                        font-size: 1.1rem;
                        line-height: 1.7;
                        margin-bottom: 35px;
                    }

                    .criteria-btn {
                        display: inline-flex;
                        align-items: center;
                        gap: 12px;
                        background: linear-gradient(135deg, #2196f3 0%, #1565c0 100%);
                        color: white !important;
                        padding: 16px 35px;
                        border-radius: 30px;
                        text-decoration: none;
                        font-weight: 600;
                        font-size: 1.1rem;
                        box-shadow: 0 8px 20px rgba(33, 150, 243, 0.3);
                        transition: all 0.3s ease;
                    }

                    .criteria-btn:hover {
                        background: linear-gradient(135deg, #1e88e5 0%, #0d47a1 100%);
                        transform: translateY(-2px);
                        box-shadow: 0 10px 25px rgba(33, 150, 243, 0.4);
                    }
                </style>

                <div class="criteria-card">
                    <div class="criteria-icon-wrap">
                        <i class="fas fa-file-contract criteria-icon"></i>
                    </div>
                    <h2 class="criteria-title">Детальні критерії оцінювання</h2>
                    <p class="criteria-text">
                        Уся інформація щодо критеріїв оцінювання навчальних досягнень учнів гімназії дбайливо
                        впорядкована та доступна для перегляду у єдиній електронній теці.
                    </p>
                    <a href="https://drive.google.com/drive/folders/1NzvAKxwcJ_SVgXKihCgTjQzTomhRL5DX?usp=sharing"
                        target="_blank" class="criteria-btn">
                        <i class="fab fa-google-drive"></i> Відкрити на Google Drive
                    </a>
                </div>

            </div>
        </section>
    </main>

    <script src="assets/js/components.js"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>

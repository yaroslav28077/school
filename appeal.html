<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Звернення — Українська класична гімназія</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" href="assets/img/logo.png" type="image/png">
</head>

<body>

    <div id="header-placeholder"></div>

    <main>
        <section class="section">
            <div class="container" style="max-width: 800px;">
                <h2 class="page-title">Звернення</h2>

                <div class="intro-box" style="text-align: center; margin-bottom: 20px;">
                    Маєте запитання, пропозиції або потребуєте допомоги? Заповніть форму нижче, і ми зв'яжемося з вами
                    найближчим часом.
                </div>

                <div class="appeal-form-container">
                    <form class="appeal-form" name="appeal" method="POST" data-netlify="true"
                        action="/appeal-success.html" netlify-honeypot="bot-field">

                        <p class="hidden" style="display: none;">
                            <label>Не заповнюйте це поле, якщо ви людина: <input name="bot-field" /></label>
                        </p>

                        <div class="form-group border-focus">
                            <label for="name" class="form-label">Ваше ім'я та прізвище <span
                                    class="required">*</span></label>
                            <input type="text" id="name" name="name" class="form-control" required
                                placeholder="Іван Іваненко">
                        </div>

                        <div class="form-group border-focus">
                            <label for="email" class="form-label">Email для зв'язку <span
                                    class="required">*</span></label>
                            <input type="email" id="email" name="email" class="form-control" required
                                placeholder="example@email.com">
                        </div>

                        <div class="form-group border-focus">
                            <label for="subject" class="form-label">Тема звернення</label>
                            <input type="text" id="subject" name="subject" class="form-control"
                                placeholder="Загальне питання">
                        </div>

                        <div class="form-group border-focus">
                            <label for="message" class="form-label">Текст звернення <span
                                    class="required">*</span></label>
                            <textarea id="message" name="message" class="form-control" rows="6" required
                                placeholder="Опишіть ваше питання або пропозицію..."></textarea>
                        </div>

                        <div class="form-actions text-center" style="margin-top: 30px;">
                            <button type="submit" class="btn btn-submit-appeal">Відправити звернення</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/components.js"></script>
    <script src="assets/js/script.js"></script>

</body>

</html>
